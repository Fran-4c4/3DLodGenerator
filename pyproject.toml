[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lodext"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Independent building heights and LiDAR-derived CityJSON surface reconstruction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
geo = ["numpy>=2.2,<3", "shapely>=2.1,<3", "pyproj>=3.7,<4", "rasterio>=1.4,<2", "laspy[lazrs]>=2.7,<3"]
test = ["pytest>=9,<10", "jsonschema>=4.23,<5"]

[project.scripts]
lodext = "lodext.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
