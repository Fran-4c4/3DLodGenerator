<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3DLodExt · Cesium example</title>
  <!-- Optional example: the engine/exporter itself does not need this CDN.
       CesiumJS 1.137, Apache-2.0; retain the visible Cesium credit. -->
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Widgets/widgets.css">
  <style>
    html,body,#view{width:100%;height:100%;margin:0;overflow:hidden;background:#14243b}
    #status{position:absolute;top:12px;left:12px;z-index:2;padding:10px 14px;background:#17202fee;color:#fff;border-radius:6px;font:14px system-ui;max-width:600px}
  </style>
</head>
<body>
  <div id="view"></div><div id="status">Loading the example tileset…</div>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Cesium.js"></script>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try {
      if(location.protocol==='file:')throw Error('Serve this example over HTTP; do not open it using file://.');
      const viewer=new Cesium.Viewer('view',{baseLayer:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false});
      viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#14243b');
      const url=new URLSearchParams(location.search).get('tileset')||'../outputs/first-run-tiles/tileset.json';
      const tileset=await Cesium.Cesium3DTileset.fromUrl(url);
      let contentLoaded=false;
      tileset.tileLoad.addEventListener(()=>{contentLoaded=true;});
      tileset.allTilesLoaded.addEventListener(()=>{if(contentLoaded)status.textContent='3DLodExt · 3D content loaded. Drag to navigate; scroll to zoom. Vertical placement follows the explicit export settings.';});
      tileset.tileFailed.addEventListener(error=>{status.textContent='Content error: '+error.message;});
      viewer.scene.primitives.add(tileset);
      // Frame the whole synthetic group, including small/disconnected bodies.
      await viewer.zoomTo(tileset,new Cesium.HeadingPitchRange(0,-0.65,tileset.boundingSphere.radius*3.5));
      if(!contentLoaded)status.textContent='View ready; loading 3D content…';
    }catch(error){status.textContent='Could not load: '+error.message;}
  })();
  </script>
</body>
</html>
