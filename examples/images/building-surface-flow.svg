<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1210" viewBox="0 0 640 1210" role="img" aria-labelledby="title description">
<title id="title">Building reconstruction from footprints and LiDAR geometry</title>
<desc id="description">Infer exterior ground, separate candidate roof planes, attribute them using neighbouring structures, assess visible support, and calculate height. Unknown-height footprints remain visible.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#47646b"/></marker></defs>
<rect width="640" height="1210" fill="#fff"/>
<rect x="20" y="20" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Footprints + original LiDAR XYZ</text>
<text x="320" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Keep source boundaries and identifiers</text>
<text x="320" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">LAS labels are metadata</text>
<path d="M320,150 V185" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="190" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Infer the local ground</text>
<text x="320" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Use coherent exterior surfaces</text>
<text x="320" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Keep slopes and independent base evidence</text>
<path d="M320,320 V355" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="360" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Separate roof candidates</text>
<text x="320" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Retain distinct height layers</text>
<text x="320" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Fit horizontal and inclined surfaces</text>
<path d="M320,490 V525" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="530" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Attribute surfaces in context</text>
<text x="320" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Compare neighbouring parts and levels</text>
<text x="320" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Separate upper rooms from lower roofs</text>
<path d="M320,660 V695" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="700" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Check the observable roof area</text>
<text x="320" y="773" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Use spacing, shape and horizontal uncertainty</text>
<text x="320" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Preserve unsupported gaps</text>
<path d="M320,830 V865" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="870" width="600" height="130" rx="12" fill="#e8f4f2" stroke="#377b76" stroke-width="2"/>
<text x="320" y="906" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Calculate the building height</text>
<text x="320" y="943" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Attributed roof elevation minus local base</text>
<text x="320" y="972" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Record any auxiliary inference</text>
<path d="M320,1000 V1035" stroke="#47646b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="1040" width="600" height="130" rx="12" fill="#fff4dc" stroke="#a77924" stroke-width="2"/>
<text x="320" y="1076" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173d42">Keep every valid footprint visible</text>
<text x="320" y="1113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Supported height: LoD1 volume</text>
<text x="320" y="1142" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#28464b">Uncertain height: labelled footprint</text>
</svg>