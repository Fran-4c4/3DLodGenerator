<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Separate roof observations from ground observations</title>
<desc id="desc">Schematic sampling plans distinguish a preserved footprint, inset roof support and a ground-point sampling ring excluding the building and a neighbour. A section distinguishes ground elevation, roof elevation and relative height.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#253b46}.heading{font-size:27px;font-weight:650}.label{font-size:22px}.small{font-size:19px}</style>
<rect width="1100" height="740" rx="18" fill="#f4f7f8"/>
<text x="35" y="45" class="heading">Sample the roof and the ground independently</text>
<text x="35" y="80" class="small">Roof support inside the footprint · ground support outside occupied areas</text>
<text x="40" y="128" class="label">Roof: supported observations inside the body</text>
<rect x="75" y="165" width="330" height="180" fill="#ecd1c5" stroke="#a65c48" stroke-width="3"/>
<rect x="105" y="195" width="270" height="120" fill="#e2ab96" stroke="#a65c48" stroke-dasharray="7 5" stroke-width="2"/>
<g fill="#843f31"><circle cx="135" cy="222" r="5"/><circle cx="180" cy="222" r="5"/><circle cx="225" cy="222" r="5"/><circle cx="270" cy="222" r="5"/><circle cx="315" cy="222" r="5"/><circle cx="350" cy="222" r="5"/><circle cx="135" cy="265" r="5"/><circle cx="180" cy="265" r="5"/><circle cx="225" cy="265" r="5"/><circle cx="270" cy="265" r="5"/><circle cx="315" cy="265" r="5"/><circle cx="350" cy="265" r="5"/></g>
<path d="M110 318L80 375 M380 194L425 170" stroke="#576d77" stroke-width="2"/>
<text x="45" y="405" class="small">Inset support, where geometry permits</text>
<text x="215" y="155" class="small">Original footprint retained</text>
<text x="580" y="128" class="label">Ground: points outside occupied areas</text>
<rect x="600" y="158" width="425" height="212" rx="28" fill="#c8dfcb" stroke="#5c8a6b" stroke-width="2"/>
<rect x="650" y="208" width="225" height="112" fill="#ecd1c5" stroke="#a65c48" stroke-width="3"/>
<rect x="925" y="208" width="120" height="112" fill="#d4d9dd" stroke="#77848a" stroke-width="2"/>
<g fill="#507d5c"><circle cx="625" cy="185" r="4"/><circle cx="675" cy="185" r="4"/><circle cx="725" cy="185" r="4"/><circle cx="775" cy="185" r="4"/><circle cx="825" cy="185" r="4"/><circle cx="875" cy="185" r="4"/><circle cx="925" cy="185" r="4"/><circle cx="625" cy="265" r="4"/><circle cx="900" cy="265" r="4"/><circle cx="625" cy="345" r="4"/><circle cx="675" cy="345" r="4"/><circle cx="725" cy="345" r="4"/><circle cx="775" cy="345" r="4"/><circle cx="825" cy="345" r="4"/><circle cx="875" cy="345" r="4"/><circle cx="925" cy="345" r="4"/></g>
<text x="693" y="271" class="small">Building excluded</text>
<text x="945" y="270" class="small">Neighbour</text>
<text x="606" y="405" class="small">Neighbouring footprints are excluded too</text>
<path d="M40 440H1060" stroke="#d4dfe3"/>
<text x="40" y="483" class="label">Elevation is not the same as building height</text>
<path d="M90 655H1040" stroke="#527c60" stroke-width="4"/>
<rect x="210" y="525" width="245" height="130" fill="#df9b83"/>
<path d="M180 525H515" stroke="#a45843" stroke-width="4"/>
<path d="M510 525H540V655H510" fill="none" stroke="#385d6a" stroke-width="2"/>
<text x="575" y="548" class="label">Roof elevation = 31 m</text>
<text x="575" y="595" class="label">Visible height = 31 − 25 = 6 m</text>
<text x="575" y="645" class="label">Ground elevation = 25 m (LiDAR)</text>
<text x="40" y="712" class="small">Example values share one vertical reference. Horizontal reprojection cannot reconcile vertical datums.</text>
</svg>
