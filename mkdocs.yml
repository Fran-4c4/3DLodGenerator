# tools/build_docs.py stages only explicitly selected public files here.
# Do not point docs_dir at the repository root: it contains ignored local data.
site_name: 3DLodExt
site_description: Independent 3D geographic reconstruction from classified polygons and elevation data
site_url: !ENV [LODEXT_DOCS_SITE_URL, 'http://127.0.0.1:8000/']
docs_dir: work/docs-source
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Introduction:
      - What is 3DLodExt?: index.md
      - How it works: how_it_works.md
      - Supported outputs and limits: capabilities.md
  - Get started:
      - Installation: installation.md
      - Your first model: first_run.md
      - Use your own data: your_data.md
  - Prepare inputs:
      - GeoPackage and elevation files: input_contract_v0_2.md
      - LiDAR and auxiliary heights: input_strategy.md
      - Ground from LiDAR: point_ground.md
      - Optional DTM: dtm_preparation.md
  - Generate and inspect:
      - Building surfaces and point ownership: building_recovery.md
      - Terraces within one footprint: roof_regions.md
      - Commands and configuration: cli_reference.md
      - Output files and reports: outputs.md
      - View and check your model: viewer_validation.md
      - Roads, terrain and water: surface_workflow.md
      - 3D Tiles and Cesium: cesium.md
  - Examples:
      - Datasets and models: examples.md
      - Las Canteras observations: las_canteras.md
      - Parameter comparisons: parameter_examples.md
  - Troubleshooting: troubleshooting.md
  - Guide contents: manual.md
